<div class="gc-confirm" ng-if="vm.open" ng-keydown="vm.keydown($event)">
  <button class="gc-confirm__backdrop" type="button" aria-label="Fechar" ng-click="vm.backdrop()"></button>
  <section class="modal-dialog {{ vm.size }}" role="dialog" aria-modal="true" aria-labelledby="gc-confirm-title">
    <div class="modal-content">
      <header class="modal-header">
        <button type="button" class="close" aria-label="Fechar" ng-click="vm.cancel('close')"><span aria-hidden="true">&times;</span></button>
        <h4 class="modal-title" id="gc-confirm-title">{{ vm.title }}</h4>
      </header>
      <div class="modal-body">
        <p ng-if="vm.message">{{ vm.message }}</p>
        <div ng-transclude></div>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-default" ng-disabled="vm.busy" ng-click="vm.cancel('cancel')">{{ vm.cancelLabel }}</button>
        <button type="button" class="btn {{ vm.confirmClass }}" ng-disabled="vm.busy" ng-click="vm.confirm()">
          <span class="glyphicon glyphicon-ok" aria-hidden="true"></span>
          {{ vm.confirmLabel }}
        </button>
      </footer>
    </div>
  </section>
</div>
<div ng-repeat="dialog in vm.dialogs.lista track by dialog.id">
<div ng-if="!dialog.closed" ng-show="!dialog.hidden"
  class="gc-confirm {{ dialog.classe }}" ng-keydown="vm.dialogKeydown($event, dialog)">
  <div class="gc-confirm__backdrop"></div>
  <section class="modal-dialog {{ dialog.classe_size }}" role="dialog" aria-modal="true" aria-labelledby="gc-confirm-{{ dialog.id }}" tabindex="-1">
    <div class="modal-content">
      <header class="modal-header">
        <h4 class="modal-title" id="gc-confirm-{{ dialog.id }}" ng-attr-style="{{ dialog.CSS_TITULO }}">{{ dialog.titulo }}</h4>
        <button ng-if="dialog.tipo == 2" type="button" class="btn btn-danger" ng-click="dialog.cancelar($event)">Cancelar</button>
      </header>
      <div class="modal-body"><p>{{ dialog.pergunta }}</p></div>
      <footer class="modal-footer">
        <button ng-repeat="button in dialog.botao track by $index" type="button" class="btn {{ button.class }}"
          data-hotkey="{{ button.hotkey }}" ng-disabled="button.aguardar2 && button.TEMPO_AGUARDAR > 0" ng-click="button.executar($event, button)">
          <span class="glyphicon {{ button.glyphicon }}" aria-hidden="true"></span> {{ button.desc }}
          <span ng-if="button.aguardar2 && button.TEMPO_AGUARDAR > 0">({{ button.TEMPO_AGUARDAR }})</span>
        </button>
      </footer>
    </div>
  </section>
</div>
</div>

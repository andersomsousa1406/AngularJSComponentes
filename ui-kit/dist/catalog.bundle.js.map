<fieldset ng-disabled="vm.isDisabled"><legend>{{ vm.label }}</legend><div class="options" ng-class="{ inline: vm.inline }"><label ng-repeat="option in vm.options track by $index" ng-class="{ disabled: option.disabled || vm.isDisabled }"><input type="radio" name="{{ vm.uid }}" ng-checked="vm.model === option.value" ng-required="vm.required" ng-disabled="vm.isDisabled || option.disabled" ng-click="vm.choose(option)"><span><strong>{{ option.label }}</strong><small ng-if="option.description">{{ option.description }}</small></span></label></div></fieldset>

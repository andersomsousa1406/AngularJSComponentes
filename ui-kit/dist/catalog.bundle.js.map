<button class="home-button tone-{{ vm.color }}" ng-disabled="vm.isDisabled || vm.loading" ng-click="vm.click($event)" aria-busy="{{ vm.loading }}" type="button"><span class="home-icon"><g-spinner ng-if="vm.loading"></g-spinner><g-icon ng-if="!vm.loading" name="{{ vm.icon }}"></g-icon></span><span class="home-body"><small>{{ vm.group }}</small><strong>{{ vm.text }}</strong><span ng-if="vm.description">{{ vm.description }}</span></span><g-icon name="arrow"></g-icon></button>

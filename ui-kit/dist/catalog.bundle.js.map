<div class="field"><label for="{{ vm.uid }}">{{ vm.label }}<span ng-if="vm.required"> *</span></label><input id="{{ vm.uid }}" type="date" ng-value="vm.model" ng-attr-min="{{ vm.min || undefined }}" ng-attr-max="{{ vm.max || undefined }}" ng-required="vm.required" ng-disabled="vm.isDisabled" ng-readonly="vm.readonly" aria-invalid="{{ !!(vm.erro || vm.validation) }}" ng-attr-aria-describedby="{{ vm.erro || vm.validation || vm.hint ? vm.uid + '-help' : undefined }}" ng-on-change="vm.change($event)"><small id="{{ vm.uid }}-help" ng-if="vm.erro || vm.validation || vm.hint" ng-class="{ error: vm.erro || vm.validation }" ng-attr-role="{{ vm.erro || vm.validation ? 'alert' : undefined }}">{{ vm.erro || vm.validation || vm.hint }}</small></div>

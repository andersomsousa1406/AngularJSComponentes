<div class="group" role="group" aria-label="{{ vm.label }}" ng-keydown="vm.keydown($event)"><button type="button" ng-repeat="item in vm.items track by $index" ng-class="{ selected: vm.value === item.value }" aria-pressed="{{ vm.value === item.value }}" ng-disabled="vm.isDisabled || item.disabled" ng-click="vm.choose(item)"><g-icon ng-if="item.icon" name="{{ item.icon }}"></g-icon>{{ item.label }}</button></div>

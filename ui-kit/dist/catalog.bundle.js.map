<div class="search"><label class="sr-only" for="{{ vm.uid }}">{{ vm.label }}</label><g-icon class="search-icon" name="search"></g-icon><input id="{{ vm.uid }}" type="search" role="combobox" aria-autocomplete="list" aria-expanded="{{ vm.open && !vm.isDisabled }}" aria-controls="{{ vm.uid }}-list" ng-attr-aria-activedescendant="{{ vm.open && vm.active >= 0 ? vm.uid + '-option-' + vm.active : undefined }}" ng-value="vm.model" ng-disabled="vm.isDisabled" placeholder="{{ vm.placeholder }}" ng-on-input="vm.change($event)" ng-focus="vm.open = true" ng-keydown="vm.keydown($event)" autocomplete="off"><kbd>⌕</kbd><div class="results" ng-if="vm.open && !vm.isDisabled" id="{{ vm.uid }}-list" role="listbox" aria-label="{{ vm.label }}"><button ng-repeat="row in vm.matches track by $index" type="button" role="option" id="{{ vm.uid }}-option-{{ $index }}" aria-selected="{{ $index === vm.active }}" ng-class="{ active: $index === vm.active }" ng-click="vm.choose(row)"><span class="result-code">{{ row[vm.fields[0]] }}</span><span><strong>{{ row[vm.fields[vm.fields.length - 1]] }}</strong><small ng-if="vm.fields.length > 2">{{ row[vm.fields[1]] }}</small></span><g-icon name="arrow"></g-icon></button><p ng-if="!vm.matches.length">Nenhum resultado encontrado.</p></div></div>

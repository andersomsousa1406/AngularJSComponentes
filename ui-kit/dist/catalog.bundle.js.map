<label class="switch" ng-class="{ disabled: vm.isDisabled }"><input type="checkbox" role="switch" ng-checked="vm.model" aria-checked="{{ vm.model }}" ng-disabled="vm.isDisabled" ng-click="vm.change()" aria-label="{{ vm.label }}"><span class="track" aria-hidden="true"></span><span class="copy"><strong>{{ vm.label }}</strong><small ng-if="vm.description">{{ vm.description }}</small></span></label>

<dialog class="g-dialog size-{{ vm.size }}" aria-labelledby="{{ vm.uid }}-title" ng-attr-aria-describedby="{{ vm.description ? vm.uid + '-description' : undefined }}" ng-click="vm.backdrop($event)"><header><div><h2 id="{{ vm.uid }}-title">{{ vm.title }}</h2><p id="{{ vm.uid }}-description" ng-if="vm.description">{{ vm.description }}</p></div><g-button icon="close" color="secondary" variant="ghost" size="sm" aria-label="Fechar diálogo" is-disabled="vm.busy" on-click="vm.close('button')"></g-button></header><div class="body" ng-transclude></div><footer><g-button text="{{ vm.cancelText }}" color="secondary" variant="outline" is-disabled="vm.busy" on-click="vm.close('cancel')"></g-button><g-button ng-if="vm.confirmText" text="{{ vm.confirmText }}" loading="vm.busy" on-click="vm.confirm()"></g-button></footer></dialog>

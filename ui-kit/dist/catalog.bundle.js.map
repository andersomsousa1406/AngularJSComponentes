<button class="button color-{{ vm.color }} variant-{{ vm.variant }} size-{{ vm.size }} shape-{{ vm.shape }} {{ vm.customClass }}" ng-class="{ block: vm.block }" type="{{ vm.type }}" ng-disabled="vm.isDisabled || vm.loading" aria-busy="{{ vm.loading }}" ng-attr-aria-label="{{ vm.ariaLabel || (vm.loading ? vm.textLoading : vm.text) }}" ng-click="vm.click($event)"><g-spinner ng-if="vm.loading" size="sm" label="{{ vm.textLoading }}"></g-spinner><g-icon ng-if="vm.icon && !vm.loading" name="{{ vm.icon }}"></g-icon><span ng-if="vm.text || vm.loading">{{ vm.loading ? vm.textLoading : vm.text }}</span></button>

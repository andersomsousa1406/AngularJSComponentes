<div class="upload"><strong class="label">{{ vm.label }}</strong><div class="dropzone" ng-class="{ dragging: vm.dragging, disabled: vm.isDisabled }" ng-on-dragover="$event.preventDefault(); vm.dragging = !vm.isDisabled" ng-on-dragleave="vm.dragging = false" ng-on-drop="vm.drop($event)"><g-icon name="download"></g-icon><label for="{{ vm.uid }}">Escolher arquivos<input id="{{ vm.uid }}" type="file" accept="{{ vm.accept }}" ng-attr-multiple="{{ vm.multiple || undefined }}" ng-disabled="vm.isDisabled" ng-on-change="vm.select($event)"></label><span>ou arraste os arquivos para cá</span><small>Até {{ vm.maxSizeMb }} MB por arquivo · {{ vm.multiple ? vm.maxFiles : 1 }} arquivo(s)</small></div><ul ng-if="vm.files.length"><li ng-repeat="file in vm.files track by $index"><g-icon name="folder"></g-icon><span class="filename">{{ file.name }}<small>{{ vm.size(file.size) }}</small></span><button type="button" ng-disabled="vm.isDisabled" aria-label="Remover {{ file.name }}" ng-click="vm.remove($index)"><g-icon name="close"></g-icon></button></li></ul><p ng-repeat="error in vm.errors track by $index" class="error" role="alert">{{ error }}</p></div>

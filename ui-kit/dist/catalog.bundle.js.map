<section class="card" aria-label="{{ vm.title }}"><header ng-if="vm.title"><g-icon ng-if="vm.icon" name="{{ vm.icon }}"></g-icon><div><h2>{{ vm.title }}</h2><p ng-if="vm.description">{{ vm.description }}</p></div></header><div class="content" ng-class="{ padded: vm.padded }" ng-transclude></div></section>

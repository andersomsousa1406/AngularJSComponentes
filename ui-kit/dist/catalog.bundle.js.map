<div class="select"><label for="{{ vm.uid }}">{{ vm.label }}<span ng-if="vm.required"> *</span></label><select id="{{ vm.uid }}" ng-model="vm.draft" ng-change="vm.change()" ng-disabled="vm.isDisabled" ng-required="vm.required" ng-attr-aria-invalid="{{ !!vm.erro }}" ng-attr-aria-describedby="{{ vm.erro ? vm.uid + '-error' : undefined }}" ng-options="item[vm.valueKey] as item[vm.labelKey] disable when item.disabled for item in vm.options"><option value="">{{ vm.placeholder }}</option></select><small id="{{ vm.uid }}-error" role="alert" ng-if="vm.erro">{{ vm.erro }}</small></div>

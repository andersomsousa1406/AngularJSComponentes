<div class="field" ng-class="{ invalid: vm.erro }"><input id="{{ vm.uid }}" type="{{ vm.type }}" ng-value="vm.model" placeholder=" " ng-disabled="vm.isDisabled" ng-readonly="vm.readonly" ng-required="vm.required" autocomplete="{{ vm.autocomplete }}" ng-attr-aria-invalid="{{ !!vm.erro }}" ng-attr-aria-describedby="{{ vm.erro || vm.hint ? vm.uid + '-help' : undefined }}" ng-on-input="vm.change($event)" ng-blur="vm.blur($event)"><label for="{{ vm.uid }}">{{ vm.label }}<span ng-if="vm.required"> *</span></label><small id="{{ vm.uid }}-help" ng-if="vm.erro || vm.hint" ng-attr-role="{{ vm.erro ? 'alert' : undefined }}">{{ vm.erro || vm.hint }}</small></div>

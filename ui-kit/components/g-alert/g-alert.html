<div ng-if="vm.visible" class="alert tone-{{ vm.color }}" ng-attr-role="{{ vm.color === 'danger' ? 'alert' : 'status' }}"><g-icon name="{{ vm.color === 'success' ? 'check' : 'info' }}"></g-icon><div class="body"><strong ng-if="vm.title">{{ vm.title }}</strong><p ng-if="vm.message">{{ vm.message }}</p><div ng-transclude></div></div><button ng-if="vm.dismissible" type="button" aria-label="Fechar aviso" ng-click="vm.$emit('onDismiss')"><g-icon name="close"></g-icon></button></div>

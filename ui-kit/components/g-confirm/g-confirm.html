<g-modal open="vm.open" title="{{ vm.title }}" size="sm" confirm-text="{{ vm.confirmText }}" cancel-text="{{ vm.cancelText }}" confirm-color="{{ vm.color }}" busy="vm.busy" close-on-backdrop="false" on-confirm="vm.$emit('onConfirm')" on-close="vm.$emit('onCancel', $value)"><div class="confirmation color-{{ vm.color }}"><span class="symbol"><g-icon name="{{ vm.color === 'danger' ? 'trash' : 'info' }}"></g-icon></span><p>{{ vm.message }}</p></div></g-modal>

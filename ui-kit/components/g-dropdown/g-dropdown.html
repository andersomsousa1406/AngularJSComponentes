<div class="dropdown" ng-keydown="vm.keydown($event)"><button class="trigger" type="button" ng-disabled="vm.isDisabled" aria-haspopup="menu" aria-expanded="{{ vm.open && !vm.isDisabled }}" aria-controls="{{ vm.uid }}" ng-click="vm.toggle()">{{ vm.text }}<g-icon name="{{ vm.icon }}"></g-icon></button><div ng-if="vm.open && !vm.isDisabled" id="{{ vm.uid }}" class="menu align-{{ vm.align }}" role="menu" aria-label="{{ vm.text }}"><div ng-repeat="item in vm.items track by $index"><hr ng-if="item.separator" role="separator"><button ng-if="!item.separator" role="menuitem" type="button" tabindex="-1" ng-disabled="item.disabled" ng-class="{ destructive: item.destructive }" ng-click="vm.select(item)"><g-icon ng-if="item.icon" name="{{ item.icon }}"></g-icon><span>{{ item.label }}</span></button></div><p ng-if="!vm.items.length">Nenhuma ação disponível.</p></div></div>

<label class="choice" ng-class="{ disabled: vm.isDisabled }"><input type="checkbox" ng-checked="vm.model" ng-required="vm.required" ng-disabled="vm.isDisabled" aria-label="{{ vm.label }}" ng-attr-aria-checked="{{ vm.indeterminate ? 'mixed' : vm.model }}" ng-on-change="vm.change($event)"><span><strong>{{ vm.label }}</strong><small ng-if="vm.description">{{ vm.description }}</small></span></label>

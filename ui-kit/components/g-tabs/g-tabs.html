<div class="tabs"><div class="tablist" role="tablist" aria-label="{{ vm.label }}" ng-keydown="vm.keydown($event)"><button type="button" role="tab" ng-repeat="item in vm.items track by $index" id="{{ vm.uid }}-tab-{{ $index }}" aria-controls="{{ vm.uid }}-panel" aria-selected="{{ $index === vm.selectedIndex }}" tabindex="{{ $index === vm.selectedIndex ? 0 : -1 }}" ng-disabled="item.disabled" ng-class="{ active: $index === vm.selectedIndex }" ng-click="vm.choose(item)"><g-icon ng-if="item.icon" name="{{ item.icon }}"></g-icon>{{ item.label }}<span class="badge" ng-if="item.badge != null">{{ item.badge }}</span></button></div><div ng-if="vm.selectedIndex >= 0" role="tabpanel" tabindex="0" id="{{ vm.uid }}-panel" aria-labelledby="{{ vm.uid }}-tab-{{ vm.selectedIndex }}" class="panel" ng-transclude></div></div>

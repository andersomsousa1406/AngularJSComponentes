<div class="toasts" aria-live="polite" aria-relevant="additions"><article class="g-notice color-{{ item.color }}" ng-repeat="item in vm.toast.items track by item.id"><span class="toast-icon"><g-icon name="{{ item.color === 'success' ? 'check' : 'info' }}"></g-icon></span><div><strong>{{ item.title }}</strong><p ng-if="item.message">{{ item.message }}</p></div><button type="button" ng-click="vm.dismiss(item.id)" aria-label="Fechar notificação"><g-icon name="close"></g-icon></button></article></div>

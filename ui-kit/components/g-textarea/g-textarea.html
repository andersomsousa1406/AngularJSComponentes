<div class="field"><label for="{{ vm.uid }}">{{ vm.label }}<span ng-if="vm.required"> *</span></label><textarea id="{{ vm.uid }}" ng-value="vm.model" rows="{{ vm.rows }}" ng-attr-maxlength="{{ vm.maxLength > 0 ? vm.maxLength : undefined }}" placeholder="{{ vm.placeholder }}" ng-required="vm.required" ng-disabled="vm.isDisabled" ng-readonly="vm.readonly" aria-invalid="{{ !!vm.erro }}" ng-attr-aria-describedby="{{ vm.erro || vm.hint ? vm.uid + '-help' : undefined }}" ng-on-input="vm.change($event)" ng-blur="vm.$emit('onBlur', $event.target.value)"></textarea><div class="meta"><small id="{{ vm.uid }}-help" ng-if="vm.erro || vm.hint" ng-class="{ error: vm.erro }" ng-attr-role="{{ vm.erro ? 'alert' : undefined }}">{{ vm.erro || vm.hint }}</small><small class="counter" ng-if="vm.maxLength > 0">{{ (vm.model || '').length }}/{{ vm.maxLength }}</small></div></div>

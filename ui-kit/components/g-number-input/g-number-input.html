<div class="field"><label for="{{ vm.uid }}">{{ vm.label }}<span ng-if="vm.required"> *</span></label><input id="{{ vm.uid }}" type="number" ng-value="vm.model" ng-attr-min="{{ vm.min == null ? undefined : vm.min }}" ng-attr-max="{{ vm.max == null ? undefined : vm.max }}" step="{{ vm.step }}" ng-required="vm.required" ng-disabled="vm.isDisabled" ng-readonly="vm.readonly" aria-invalid="{{ !!(vm.erro || vm.validation) }}" ng-attr-aria-describedby="{{ vm.erro || vm.validation || vm.hint ? vm.uid + '-help' : undefined }}" ng-on-input="vm.validate($event, true)" ng-blur="vm.validate($event, false)"><small id="{{ vm.uid }}-help" ng-if="vm.erro || vm.validation || vm.hint" ng-class="{ error: vm.erro || vm.validation }" ng-attr-role="{{ vm.erro || vm.validation ? 'alert' : undefined }}">{{ vm.erro || vm.validation || vm.hint }}</small></div>

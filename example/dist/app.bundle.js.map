<aside class="toast-stack" aria-live="polite" aria-label="Notificacoes">
  <article class="toast-stack__item toast-stack__item--{{ item.variant }}" ng-repeat="item in vm.items track by item.id">
    <span class="toast-stack__icon">{{ item.variant === 'success' ? '✓' : item.variant === 'danger' ? '!' : 'i' }}</span>
    <div><strong>{{ item.title }}</strong><p>{{ item.message }}</p></div>
    <button type="button" ng-click="vm.dismiss(item)" aria-label="Fechar notificacao">×</button>
    <i class="toast-stack__timer"></i>
  </article>
</aside>
